<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dermato</title>
    
    <link rel="stylesheet" href="dermato.css"> 

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>

    <div id="particles-container"></div>

    <main id="app-wrapper">
    
        <div id="splash-screen" class="hidden">
            <span class="splash-text">DERMATO</span>
        </div>
        
        <div class="chat-container hidden">
            <h1>Dermato</h1>
            
            <div id="chat-messages" class="chat-messages"></div>
            
            <div class="chat-input-container">
    <!-- Voice Note Preview -->
    <div id="audio-preview-container" class="hidden">
        <div class="preview-wrapper">
            <span id="recording-indicator" class="hidden">
                <span class="recording-dot"></span> Recording... <span id="recording-time">0:00</span>
            </span>
            <audio id="audio-preview" controls class="hidden"></audio>
            <button id="remove-audio" class="remove-btn">×</button>
        </div>
    </div>

    <!-- Image Preview -->
    <div id="image-preview-container" class="hidden">
        <div class="preview-wrapper">
            <img id="image-preview" src="" alt="Upload Preview">
            <button id="remove-image" class="remove-btn">×</button>
        </div>
    </div>

    <div class="chat-input">
        <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp, image/heic" hidden>
        
        <label for="file-input" class="icon-button" title="Upload an image">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2-2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
            </svg>
        </label>

        <!-- New Mic Button -->
        <button id="mic-button" class="icon-button" type="button" title="Record Voice Note">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </button>

        <input type="text" id="user-input" placeholder="Ask a question or upload a photo..." autocomplete="off">
        <button id="send-button">Send</button>
    </div>
</div>
        </div>
        
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
